<!doctype html>
<html lang="id">
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scanner QR Jimpitan Miriombo</title>
<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#17212b}
header{background:#1261a0;color:#fff;padding:18px 16px}.brand{font-size:21px;font-weight:800}
main{max-width:520px;margin:auto;padding:14px}.card{background:#fff;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 3px 12px #102a430d}
input{width:100%;padding:12px;border:1px solid #d6dee8;border-radius:11px;margin:6px 0 10px}
button{border:0;border-radius:12px;padding:12px 15px;font-weight:800;cursor:pointer}.primary{background:#1261a0;color:#fff}.success{background:#16834d;color:#fff}.danger{background:#b9362f;color:#fff}
#reader{width:100%;margin:auto}.ok{color:#137343}.err{color:#b42318}.big{font-size:22px;font-weight:800}
.hidden{display:none}.muted{font-size:12px;color:#6b7785}
</style>
</head>
<body>
<header><div class="brand">Jimpitan Miriombo</div><div class="muted" style="color:#dbeafe">Scanner QR Petugas</div></header>
<main>
<div id="loginCard" class="card">
<h3>Login Petugas</h3>
<p class="muted">Login ini diperlukan sebelum QR bisa mencatat pembayaran.</p>
<input id="uid" placeholder="ID Petugas">
<input id="pin" type="password" placeholder="PIN">
<button class="primary" style="width:100%" onclick="login()">Masuk</button>
<p id="loginMsg"></p>
</div>

<div id="scanCard" class="card hidden">
<div id="user"></div>
<h3>Scan QR Rumah</h3>
<div id="reader"></div>
<button class="primary" onclick="startScan()">Mulai Kamera</button>
<button onclick="stopScan()">Stop</button>
<p id="msg"></p>
<hr>
<input id="manual" placeholder="Kode rumah, contoh 001">
<button class="success" onclick="handleCode(manual.value)">Input Manual</button>
</div>

<div id="houseCard" class="card hidden">
<div class="muted">Rumah terdeteksi</div>
<div id="houseName" class="big"></div>
<div id="houseCode"></div>
<p id="houseStatus"></p>
<button id="payBtn" class="success" onclick="pay()">Catat Pembayaran Rp2.000</button>
<button onclick="clearHouse()">Scan Rumah Lain</button>
</div>
</main>
<script>
const API='https://script.google.com/macros/s/AKfycbwcOC_OmACP-_mpfFYz69rJxRtTw0jnjEszbT3davbsRjDe-uHSK7xYFw3YsPFgpSp2/exec';
let token=sessionStorage.getItem('JM_TOKEN')||'', user=JSON.parse(sessionStorage.getItem('JM_USER')||'null'), scanner=null, current=null;

function jsonp(params, cb){
  const name='jm_cb_'+Date.now()+'_'+Math.floor(Math.random()*9999);
  window[name]=function(data){delete window[name];s.remove();cb(data)};
  const s=document.createElement('script');
  params.api='1';params.callback=name;
  s.src=API+'?'+new URLSearchParams(params).toString();
  s.onerror=()=>{delete window[name];s.remove();cb({ok:false,message:'Gagal terhubung ke server.'})};
  document.body.appendChild(s);
}
function login(){
 jsonp({action:'login',id:uid.value.trim(),pin:pin.value},r=>{
  if(!r.ok){loginMsg.textContent=r.message;return}
  token=r.token;user=r.user;sessionStorage.setItem('JM_TOKEN',token);sessionStorage.setItem('JM_USER',JSON.stringify(user));
  loginCard.classList.add('hidden');scanCard.classList.remove('hidden');document.getElementById('user').textContent=user.name+' · '+user.role;
 });
}
function handleCode(code){
 code=String(code||'').replace(/[^0-9]/g,'').padStart(3,'0');
 if(!/^\d{3}$/.test(code)){msg.textContent='Kode rumah tidak valid.';return}
 jsonp({action:'house',token:token,kode:code},r=>{
   if(!r.ok){if(r.auth===false){logout();return}msg.textContent=r.message;return}
   current=r.house;houseCard.classList.remove('hidden');houseName.textContent=r.house.nama;houseCode.textContent='Kode: '+r.house.kode;
   houseStatus.textContent=r.paid?'SUDAH BAYAR MINGGU INI':'BELUM BAYAR · '+format(r.house.nominal);
   houseStatus.className=r.paid?'ok':'';
   payBtn.disabled=!!r.paid;payBtn.textContent=r.paid?'Sudah Bayar Minggu Ini':'Catat Pembayaran '+format(r.house.nominal);
 });
}
function pay(){
 if(!current)return;
 payBtn.disabled=true;
 jsonp({action:'pay',token:token,kode:current.kode},r=>{
   msg.textContent=r.message;
   if(r.ok){houseStatus.textContent='SUDAH BAYAR MINGGU INI';houseStatus.className='ok';payBtn.textContent='Sudah Bayar Minggu Ini'}
   else {payBtn.disabled=false;if(r.auth===false)logout()}
 });
}
function format(n){return 'Rp'+Number(n||0).toLocaleString('id-ID')}
function startScan(){
 if(!token){loginMsg.textContent='Login dulu.';return}
 if(scanner)return;
 scanner=new Html5Qrcode('reader');
 scanner.start({facingMode:{exact:'environment'}},{fps:10,qrbox:{width:260,height:260}},txt=>{
   const m=txt.match(/JIMPITAN(?::MIRIOMBO)?[:\-](\d{3})/i);
   if(m){handleCode(m[1]);stopScan()}
 },()=>{}).catch(e=>{msg.textContent='Kamera gagal dibuka: '+e.message});
}
function stopScan(){if(scanner){scanner.stop().then(()=>{scanner.clear();scanner=null}).catch(()=>{})}}
function clearHouse(){current=null;houseCard.classList.add('hidden');msg.textContent='';}
function logout(){token='';user=null;sessionStorage.clear();stopScan();scanCard.classList.add('hidden');houseCard.classList.add('hidden');loginCard.classList.remove('hidden');}
if(token&&user){loginCard.classList.add('hidden');scanCard.classList.remove('hidden');document.getElementById('user').textContent=user.name+' · '+user.role}
</script>
</body></html>
